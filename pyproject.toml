[build-system]
requires = [
  "scikit-build-core>=0.11",
  "nanobind>=2.4",
]
build-backend = "scikit_build_core.build"

[project]
name = "tensorcx"
version = "0.1.0"
description = "Python-first accelerator runtime and kernel compiler, starting with Apple Metal."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Serkan Altuntas", email = "serkan@altuntas.dev" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=2.0,<3",
]

[project.urls]
Homepage = "https://tensor.cx"
Documentation = "https://tensor.cx/docs/"
Repository = "https://github.com/serkanaltuntas/tensor.cx"
Issues = "https://github.com/serkanaltuntas/tensor.cx/issues"

[project.optional-dependencies]
dev = [
  "nanobind>=2.4",
  "pytest>=8",
]

[tool.scikit-build]
wheel.packages = ["python/tensorcx"]
wheel.license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

# Explicitly include the native sources in the sdist so a source build works
# regardless of scikit-build-core's git-vs-heuristic file discovery.
sdist.include = [
  "CMakeLists.txt",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "cmake/*.py",
  "cpp/**/*.cpp", "cpp/**/*.h", "cpp/**/*.cu", "cpp/**/*.metal", "cpp/**/*.mm",
  "bindings/*.cpp",
  "third_party/dlpack/*",
  "python/**/*.py",
  "tests/cpp/**/*.cpp", "tests/cpp/**/*.ptx",
  "examples/*.py",
  "tools/*.py",
  "docs/**/*.md", "docs/**/*.json",
]
sdist.exclude = [
  "**/__pycache__/**", "**/*.pyc", "**/*.pyo",
  ".env", ".env.*", "**/.env", "**/.env.*",
  "**/*.key", "**/*.pem", "**/*.p12", "**/*.pfx",
  "build/**", "dist/**", ".venv/**", ".git/**",
  "website/**",
  "integrations/**",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["-ra"]
markers = [
  "backend_capability(capability, include_cpu=True): parametrize a test over backends that declare a runtime capability",
]
