[build-system]
requires = [
  "scikit-build-core>=0.11",
  "nanobind>=2.4",
]
build-backend = "scikit_build_core.build"

[project]
name = "tensorcx"
version = "0.1.0"
description = "Python-first accelerator runtime and kernel compiler, starting with Apple Metal."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Serkan Altuntas", email = "serkan@altuntas.dev" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=2.0,<3",
]

[project.urls]
Homepage = "https://tensor.cx"
Documentation = "https://tensor.cx/docs/"
Repository = "https://github.com/serkanaltuntas/tensor.cx"
Issues = "https://github.com/serkanaltuntas/tensor.cx/issues"

[project.scripts]
tensorcx-doctor = "tensorcx_doctor:main"

[project.optional-dependencies]
dev = [
  "nanobind>=2.4",
  "pytest>=8",
]

[tool.scikit-build]
wheel.packages = ["python/tensorcx"]
wheel.license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

# Explicitly include the native sources in the sdist so a source build works
# regardless of scikit-build-core's git-vs-heuristic file discovery.
sdist.include = [
  "CMakeLists.txt",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "cmake/*.py",
  "cpp/**/*.cpp", "cpp/**/*.h", "cpp/**/*.cu", "cpp/**/*.metal", "cpp/**/*.mm", "cpp/**/*.comp", "cpp/**/*.glsl",
  "bindings/*.cpp",
  "third_party/dlpack/*",
  "python/**/*.py",
  "tests/cpp/**/*.cpp", "tests/cpp/**/*.ptx",
  "tests/cpp/**/*.comp",
  "examples/*.py",
  "tools/*.py",
  "docs/**/*.md", "docs/**/*.json",
]
sdist.exclude = [
  "**/__pycache__/**", "**/*.pyc", "**/*.pyo",
  ".env", ".env.*", "**/.env", "**/.env.*",
  "**/*.key", "**/*.pem", "**/*.p12", "**/*.pfx",
  "build/**", "dist/**", ".venv/**", ".git/**",
  "website/**",
  "integrations/**",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["-ra"]
markers = [
  "backend_capability(capability, include_cpu=True): parametrize a test over backends that declare a runtime capability",
]

# Linux CPU artifacts only; ordinary source/CUDA/Metal builds are unaffected.
[tool.cibuildwheel]
build = ["cp311-manylinux_x86_64", "cp312-manylinux_x86_64", "cp313-manylinux_x86_64"]
archs = ["x86_64"]
build-frontend = "uv"
test-requires = ["pytest>=8"]
test-command = [
  "python -I {project}/tools/distribution_probe.py --variant cpu",
  "python -I -m tensorcx_doctor --json",
  "tensorcx-doctor --json",
  "python -I {project}/examples/cuda_mlp.py --device cpu --repeats 2",
  "python -I -m pytest {project}/tests/python -q -o cache_dir=/tmp/tensorcx-pytest-cache",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:1e7b8460ad8fb3fb0fbe1cd818845159ac896b4fd17452d56e892c291f3b97a8"
container-engine = { name = "docker", disable-host-mount = true }
environment = { CMAKE_ARGS = "-DTENSORCX_ENABLE_METAL=OFF -DTENSORCX_ENABLE_CUDA=OFF", CMAKE_BUILD_PARALLEL_LEVEL = "2", CFLAGS = "-O2 -march=x86-64 -mtune=generic", CXXFLAGS = "-O2 -march=x86-64 -mtune=generic", TENSORCX_LLVM_BIN = "/nonexistent-tensorcx-llvm" }
repair-wheel-command = "auditwheel repair --only-plat --plat manylinux_2_28_x86_64 -w {dest_dir} {wheel}"
