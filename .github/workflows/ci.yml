name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  torch-bridge:
    name: Optional PyTorch CPU bridge (${{ matrix.torch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.4.1', '2.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - name: Install core and CPU PyTorch independently
        env:
          TORCH_VERSION: ${{ matrix.torch }}
        run: |
          CMAKE_ARGS="-DTENSORCX_ENABLE_METAL=OFF" uv pip install -e ".[dev]"
          uv pip install "torch==$TORCH_VERSION" --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install optional bridge distribution
        run: |
          uv build integrations/torch-tensorcx --out-dir build/torch-bridge-dist
          uv pip install --no-deps build/torch-bridge-dist/*.whl
          uv run --no-sync python -c 'import torch_tensorcx'
      - name: Check sharing, custom op registration and graph capture
        run: |
          uv run --no-sync pytest tests/python/test_torch_bridge.py -q
          uv run --no-sync python examples/torch_bridge.py
          uv run --no-sync python benchmarks/bench_torch_bridge.py --device cpu --repeats 2 --warmup 1

  website:
    name: Website build and browser checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:cloudflare
      - run: npx --no-install wrangler deploy --dry-run

  publication:
    name: Publication hygiene and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Check source and historical publication metadata
        run: uv run --no-project --python 3.12 python tools/check_publication.py --history
      - name: Scan complete history with pinned Gitleaks
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner

  distribution-cpu:
    name: CPU source distribution and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build from sdist and validate isolated wheel install
        run: uv run --no-project --python 3.12 python tools/validate_distribution.py --variants cpu --output build/distribution-ci
      - name: Retain validated artifacts and public manifest
        uses: actions/upload-artifact@v4
        with:
          name: cpu-distribution
          path: |
            build/distribution-ci/manifest.json
            build/distribution-ci/source/*.tar.gz
            build/distribution-ci/cpu/*.whl
          retention-days: 14

  cpu:
    name: CPU path (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python }}

      - name: Install editable package
        run: CMAKE_ARGS="-DTENSORCX_ENABLE_METAL=OFF" uv pip install -e ".[dev]"

      - name: Run CPU tests
        run: uv run pytest

      - name: Run website examples against the CPU build
        run: |
          uv run --no-sync python website/src/snippets/first-tensor.py
          uv run --no-sync python website/src/snippets/operations.py
          uv run --no-sync python website/src/snippets/inference.py

      - name: Configure C++ tests
        run: |
          NANOBIND_DIR="$(uv run python -c 'import nanobind; print(nanobind.cmake_dir())')"
          PYTHON_EXECUTABLE="$(uv run python -c 'import sys; print(sys.executable)')"
          cmake -S . -B build/cpp-tests \
            -DTENSORCX_ENABLE_METAL=OFF \
            -DTENSORCX_BUILD_TESTS=ON \
            -Dnanobind_DIR="${NANOBIND_DIR}" \
            -DPython_EXECUTABLE="${PYTHON_EXECUTABLE}"

      - name: Run C++ tests
        run: |
          cmake --build build/cpp-tests
          ctest --test-dir build/cpp-tests --output-on-failure

  sanitizers:
    name: C++ tests (ASan/UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          uv pip install "nanobind>=2.4"

      # The Metal layer manages memory manually behind RAII wrappers; this job
      # runs the backend contract tests under ASan/UBSan on the CPU path so
      # leaks, overflows, and UB in the shared core/backend code fail CI.
      - name: Configure C++ tests with sanitizers
        run: |
          NANOBIND_DIR="$(uv run python -c 'import nanobind; print(nanobind.cmake_dir())')"
          PYTHON_EXECUTABLE="$(uv run python -c 'import sys; print(sys.executable)')"
          cmake -S . -B build/cpp-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTENSORCX_ENABLE_METAL=OFF \
            -DTENSORCX_BUILD_TESTS=ON \
            -DTENSORCX_ENABLE_SANITIZERS=ON \
            -Dnanobind_DIR="${NANOBIND_DIR}" \
            -DPython_EXECUTABLE="${PYTHON_EXECUTABLE}"

      - name: Run C++ tests under sanitizers
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1:strict_string_checks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          cmake --build build/cpp-sanitizers
          ctest --test-dir build/cpp-sanitizers \
            --no-tests=error --output-on-failure

  mlir-lowering:
    name: MLIR CPU runtime and lowering
    runs-on: ubuntu-latest

    # Phase 10 evidence: the tensor.cx IR -> MLIR -> native add prototype skips in
    # the other jobs because they have no LLVM/MLIR toolchain. This job installs
    # LLVM/MLIR 21.1.8 and runs runtime plus lowering tests with TENSORCX_REQUIRE_MLIR=1, which
    # turns a missing toolchain into a hard failure so the evidence is actually
    # exercised rather than silently green-skipped (see docs/MLIR_DECISION.md).
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LLVM/MLIR 21 toolchain
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-21 mlir-21-tools libmlir-21-dev

      # find_llvm_bin() requires mlir-opt, mlir-translate, AND clang as
      # unversioned names in one directory. The apt packages may install them
      # under /usr/lib/llvm-21/bin (unversioned) or only as versioned names on
      # PATH (e.g. clang-21); normalize whichever layout into one bin dir and
      # fail loudly if any tool is missing, so the lowering job never runs
      # against a half-installed toolchain.
      - name: Normalize MLIR toolchain into one bin dir
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-bin"
          for tool in mlir-opt mlir-translate clang; do
            found=""
            for cand in \
              "/usr/lib/llvm-21/bin/$tool" \
              "$(command -v "$tool-21" 2>/dev/null || true)" \
              "$(command -v "$tool" 2>/dev/null || true)"; do
              if [ -n "$cand" ] && [ -x "$cand" ]; then found="$cand"; break; fi
            done
            if [ -z "$found" ]; then
              echo "::error::LLVM/MLIR tool '$tool' not found after install"
              exit 1
            fi
            ln -sf "$found" "$RUNNER_TEMP/llvm-bin/$tool"
          done
          "$RUNNER_TEMP/llvm-bin/mlir-opt" --version
          "$RUNNER_TEMP/llvm-bin/mlir-translate" --version
          "$RUNNER_TEMP/llvm-bin/clang" --version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python 3.12

      - name: Install editable package
        run: CMAKE_ARGS="-DTENSORCX_ENABLE_METAL=OFF" uv pip install -e ".[dev]"

      # Full file under require-mode: every toolchain-dependent test (current or
      # future) must run, not skip. TENSORCX_REQUIRE_MLIR turns a missing
      # toolchain into a failure instead of a skip.
      - name: Run MLIR CPU runtime and lowering tests (must not skip)
        env:
          TENSORCX_LLVM_BIN: ${{ runner.temp }}/llvm-bin
          TENSORCX_REQUIRE_MLIR: "1"
        run: uv run pytest tests/python/test_mlir_lowering.py tests/python/test_mlir_runtime.py -v -rs

      - name: Check CUDA device lowering without a CUDA SDK or GPU
        env:
          TENSORCX_LLVM_BIN: ${{ runner.temp }}/llvm-bin
          TENSORCX_REQUIRE_MLIR: "1"
        run: uv run pytest tests/python/test_mlir_cuda_probe.py -k "not driver_runtime_probe" -v -rs

      - name: Check runtime CUDA emitter without CUDA
        env:
          TENSORCX_LLVM_BIN: ${{ runner.temp }}/llvm-bin
          TENSORCX_REQUIRE_MLIR: "1"
        run: uv run pytest tests/python/test_mlir_cuda_runtime.py tests/python/test_mlir_cuda_expressions.py -k "gpu_emitter or malformed_serialized or unsupported_before_tools or default_cuda or expression_invalid_before_tools or expression_bounds" -v -rs

      # Guard the job's purpose: pin the end-to-end lowering test by node id so a
      # rename/removal or a stray selection filter makes pytest error (exit 4)
      # instead of the job going green without the evidence ever executing.
      - name: Assert end-to-end lowering test actually executed
        env:
          TENSORCX_LLVM_BIN: ${{ runner.temp }}/llvm-bin
          TENSORCX_REQUIRE_MLIR: "1"
        run: |
          uv run pytest -v -rs \
            "tests/python/test_mlir_lowering.py::test_end_to_end_mlir_lowering_matches_cpu_reference"

  macos-metal:
    name: macOS build (${{ matrix.variant }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Metal on, MPSGraph off
            cmake_args: "-DTENSORCX_ENABLE_METAL=ON -DTENSORCX_ENABLE_MPSGRAPH=OFF"
          - variant: Metal on, MPSGraph on
            cmake_args: "-DTENSORCX_ENABLE_METAL=ON"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          uv pip install "cmake>=3.21"

      # The disabled variant locks the PROJECT.md §9.2 guarantee that custom MSL
      # matmul still builds without the optimized primitive path. Hosted macOS
      # runners may not expose a usable Metal device, so runtime Metal tests can
      # still skip; these jobs catch Apple framework compile/link breaks.
      - name: Install editable package
        run: CMAKE_ARGS="${{ matrix.cmake_args }}" uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest

      - name: Build native CPU and Metal contracts
        env:
          TENSORCX_METAL_CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: |
          NANOBIND_DIR="$(uv run --no-sync python -c 'import nanobind; print(nanobind.cmake_dir())')"
          PYTHON_EXECUTABLE="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          read -r -a METAL_OPTIONS <<< "$TENSORCX_METAL_CMAKE_ARGS"
          uv run --no-sync cmake -S . -B build/cpp-metal-tests \
            "${METAL_OPTIONS[@]}" \
            -DTENSORCX_BUILD_TESTS=ON \
            -Dnanobind_DIR="${NANOBIND_DIR}" \
            -DPython_EXECUTABLE="${PYTHON_EXECUTABLE}"
          uv run --no-sync cmake --build build/cpp-metal-tests --parallel 2

      - name: Run native contracts and report device skips
        run: |
          uv run --no-sync ctest --test-dir build/cpp-metal-tests \
            --no-tests=error --verbose --output-junit native-results.xml

      - name: Retain native Metal validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-${{ strategy.job-index }}
          path: |
            build/cpp-metal-tests/native-results.xml
            build/cpp-metal-tests/Testing/Temporary/LastTest.log
          retention-days: 14

  cuda-build:
    name: CUDA prototype build (no GPU)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    # Hosted CPU runners check compile/link, import, and unavailable-device
    # behavior. Real GPU acceptance is recorded separately on the selected host.
    steps:
      - name: Install build prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends build-essential git curl ca-certificates

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          uv pip install cmake ninja "nanobind>=2.4"

      - name: Build CUDA-enabled package
        run: CMAKE_ARGS="-DTENSORCX_ENABLE_METAL=OFF -DTENSORCX_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=52" uv pip install -e ".[dev]"

      - name: Provide Driver stub for the GPU-free build check
        run: |
          mkdir -p "$RUNNER_TEMP/cuda-driver-stub"
          ln -s /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cuda-driver-stub/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cuda-driver-stub:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify CPU fallback and CUDA unavailability
        run: |
          uv run python -c "import tensorcx as cx; assert hasattr(cx._core, 'CudaTensor'); assert not cx.is_available('cuda')"
          uv run pytest

      - name: Build and run C++ contracts
        run: |
          uv run cmake -S . -B build/cpp-cuda -G Ninja \
            -DTENSORCX_ENABLE_METAL=OFF -DTENSORCX_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=52 -DTENSORCX_BUILD_TESTS=ON \
            -Dnanobind_DIR="$(uv run python -c 'import nanobind; print(nanobind.cmake_dir())')" \
            -DPython_EXECUTABLE="$(uv run python -c 'import sys; print(sys.executable)')"
          uv run cmake --build build/cpp-cuda
          uv run ctest --test-dir build/cpp-cuda --output-on-failure
