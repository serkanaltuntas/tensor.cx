name: CI

on:
  push:
  pull_request:

jobs:
  cpu:
    name: CPU path
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: uv venv --python 3.12

      - name: Install editable package
        run: CMAKE_ARGS="-DCORTEX_ENABLE_METAL=OFF" uv pip install -e ".[dev]"

      - name: Run CPU tests
        run: uv run pytest
