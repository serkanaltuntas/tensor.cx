name: CI

on:
  push:
  pull_request:

jobs:
  cpu:
    name: CPU path (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python }}

      - name: Install editable package
        run: CMAKE_ARGS="-DCORTEX_ENABLE_METAL=OFF" uv pip install -e ".[dev]"

      - name: Run CPU tests
        run: uv run pytest

  macos-metal:
    name: macOS build (${{ matrix.variant }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Metal on, MPSGraph off
            cmake_args: "-DCORTEX_ENABLE_METAL=ON -DCORTEX_ENABLE_MPSGRAPH=OFF"
          - variant: Metal on, MPSGraph on
            cmake_args: "-DCORTEX_ENABLE_METAL=ON"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python 3.12

      # The disabled variant locks the PROJECT.md §9.2 guarantee that custom MSL
      # matmul still builds without the optimized primitive path. Hosted macOS
      # runners may not expose a usable Metal device, so runtime Metal tests can
      # still skip; these jobs catch Apple framework compile/link breaks.
      - name: Install editable package
        run: CMAKE_ARGS="${{ matrix.cmake_args }}" uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest
