name: Portable Linux wheels

# Explicit build only; never publishes to PyPI or creates a release/tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manylinux:
    name: manylinux ${{ matrix.variant }} (CPython 3.11–3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Build from sdist, repair and test installed wheels
        run: uv run --no-project --python 3.12 python tools/build_portable_wheels.py --variant ${{ matrix.variant }} --output build/portable-${{ matrix.variant }}
      - name: Retain only validated wheels, source and public manifest
        uses: actions/upload-artifact@v4
        with:
          name: tensorcx-manylinux-${{ matrix.variant }}
          path: |
            build/portable-${{ matrix.variant }}/manifest.json
            build/portable-${{ matrix.variant }}/source/*.tar.gz
            build/portable-${{ matrix.variant }}/wheels/*.whl
          retention-days: 14
